name: tests

# The plugin is a skill + hooks + docs, so there is nothing to build and nothing to deploy. What
# there IS: twenty hermetic branch suites that drive the hook scripts, one rule-carrier check, and
# a manifest/wiring check. All of them are pure `python3` + `bash` + `git`, with no network, no
# credential and no Claude Code install — which is exactly why they are worth running here.
#
# What this workflow does NOT cover, stated so a green check is not read as more than it is: it does
# not observe an AGENT obeying a written rule, a hook firing in a real session, or an adversary round
# actually running. Every "observe in the wild" item in the project's pendientes stays manual HERE.
# That is a scoping decision, not an impossibility. `claude --help` documents headless `-p`,
# credential-bearing auth and `--max-budget-usd`, so such a job is feasible and boundable; what it
# would add is a credential in CI, a per-run cost, and non-determinism these hermetic suites do not
# have. Whether that trade is worth it is an open question this workflow does not answer either way.
# A green run means the mechanical branches behave; it never means the method works.

on:
  # Every push, on every branch — not just main. A `branches: [main]` filter would make the "runs on
  # every push" claim in CLAUDE.md and test/README.md false for every feature branch, and would let
  # a broken hook sit undetected until the moment it merges.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    # BOTH platforms, and the macOS leg is not redundancy. The hooks are bash, and the one recorded
    # way this repo has shipped a silently-dead hook is an unbalanced apostrophe inside an unquoted
    # heredoc in `$( )`: bash 3.2 (which macOS still ships at /bin/bash) swallows the rest of the
    # file and the script dies at parse time. bash 5 on Ubuntu parses it fine, so an Ubuntu-only run
    # is blind to the exact failure that actually happened (0.39.0, 13 assertions).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Report the interpreters actually in use
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          python3 --version
          git --version

      - name: bash -n every hook
        run: |
          set -euo pipefail
          for f in plugins/goalspec/hooks/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: bash 3.2 parse check (macOS only — /bin/bash is 3.2 there)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for f in plugins/goalspec/hooks/*.sh; do
            /bin/bash -n "$f"
            echo "ok (3.2)  $f"
          done

      - name: Run every suite
        run: |
          set -uo pipefail
          # CLAUDE_PLUGIN_ROOT is load-bearing for three of them (gate, usage-budget,
          # terminal-precheck): they import hooks/lib/terminal_actions.py through it, and without it
          # the staleness cases degrade silently to "not stale" — indistinguishable from passing.
          export CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/goalspec"
          # Several suites build throwaway repos and commit in them. They set a local identity, but
          # a runner with no global identity at all is a harsher environment than any dev machine,
          # so make it explicit rather than depend on that holding.
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
          failed=0
          for t in test/*.py; do
            case "$(basename "$t")" in
              manifest-checks.py|temp-leak-check.py|tmp_cleanup.py|expected_check.py|suite_tmp.py|suite_bash.py) continue ;;
            esac
            echo "::group::$t"
            python3 "$t"
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "PASS $t"
            else
              echo "FAIL $t (exit $rc)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: No suite leaves anything in the temp dir
        # p-1a5a4e9828: the suites used to leave ~15 GB a day in $TMPDIR. Each suite now imports
        # test/tmp_cleanup.py; this runs every one again (default mode and --selftest), each under
        # a fresh TMPDIR, and fails if anything is left in it or in /tmp. The selftest plants a
        # suite that leaks and requires the check to notice.
        run: |
          set -euo pipefail
          export CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/goalspec"
          python3 test/temp-leak-check.py --selftest
          python3 test/temp-leak-check.py

  windows:
    # Windows, under Git Bash with python.exe (no python3), as Claude Code runs the hooks there.
    # Until 0.65.2 nothing ran on Windows, and three defects stayed invisible: the Stop gate handed
    # python a program over the 32767-character command-line cap (silent on every Stop), the
    # read-only rail read a C:/ path in the review prompt as a tree that does not exist, and the
    # suites themselves started the WSL launcher (System32\bash.exe) instead of Git Bash
    # (test/suite_bash.py). Cases about POSIX mode bits, uids, process groups or chmod denials print
    # "skipped (windows): <reason>" there; nothing is dropped silently. temp-leak-check and the
    # --selftest runs are not repeated here: they run on Ubuntu and macOS.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Report the interpreters actually in use
        run: |
          bash --version | head -1
          python --version
          git --version
          python -c "import os; print('os.name =', os.name)"
          # What utf8-stdin-branches.py rests on: python here does not default to UTF-8.
          python -c "import locale, os; print('locale encoding =', locale.getpreferredencoding(False), '| PYTHONUTF8 =', os.environ.get('PYTHONUTF8'), '| PYTHONIOENCODING =', os.environ.get('PYTHONIOENCODING'))"

      - name: run_dir on a real Windows host (the LOCALAPPDATA branch)
        run: |
          set -euo pipefail
          got=$(python plugins/goalspec/hooks/lib/run_dir.py ensure ci-windows-1 ci)
          echo "ensure: $got"
          case "$got" in
            *'\AppData\Local\goalspec\run-ci-windows-1') ;;
            *) echo "unexpected run dir: $got"; exit 1 ;;
          esac
          [ -d "$got" ]
          [ "$(python plugins/goalspec/hooks/lib/run_dir.py path ci-windows-1)" = "$got" ]
          python plugins/goalspec/hooks/lib/run_dir.py remove ci-windows-1 >/dev/null 2>&1 || true

      - name: Run every suite
        run: |
          set -uo pipefail
          export CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/goalspec"
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
          failed=0
          for t in test/*.py; do
            case "$(basename "$t")" in
              manifest-checks.py|temp-leak-check.py|tmp_cleanup.py|expected_check.py|suite_tmp.py|suite_bash.py) continue ;;
            esac
            echo "::group::$t"
            python "$t"
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "PASS $t"
            else
              echo "FAIL $t (exit $rc)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  manifests:
    # One platform is enough: this reads files and parses them. PyYAML is the only dependency, and
    # it is the point — the frontmatter check must be "a real YAML parser accepts this", which a
    # regex cannot establish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Manifest and wiring checks
        run: python3 test/manifest-checks.py

      - name: Self-test — break each check, require it to notice
        # A check that has never been seen to FAIL is not yet a check. This file has already shipped
        # two that passed on a healthy repo while missing the defect they named, so the mutation
        # probe runs here rather than living in one session's scratch directory.
        run: python3 test/manifest-checks.py --selftest

      - name: manifest-checks leaves nothing in the temp dir
        # The `suites` job has no PyYAML, so temp-leak-check skips this file there; it runs here.
        run: python3 test/temp-leak-check.py manifest-checks.py
